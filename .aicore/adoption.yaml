  # ----------------------------------------------------------------- infra
  - id: knowledge-agents
    mode: adapted
    members:
      - { id: file, destination: knowledge/agents.md }

  - id: knowledge-debt
    mode: mirror
    members:
      - { id: file, destination: knowledge/debt.md }

  - id: symptom-problem-register
    mode: mirror
    members:
      - { id: symptoms, destination: knowledge/symptoms.md }
      - { id: problems, destination: knowledge/problems.md }

  - id: query-verification-design
    mode: not_applicable

  - id: plans
    mode: mirror
    members:
      - { id: gitkeep, destination: plans/.gitkeep }

  - id: user-stories
    mode: mirror
    members:
      - { id: gitkeep, destination: user-stories/.gitkeep }

  # ---------------------------------------------------------------- config
  - id: root-runtime-spec
    mode: adapted
    members:
      - { id: root, destination: AGENTS.md }

  - id: opencode-config
